<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card_News2</title>

    <link rel="stylesheet" href="../css/card_news2.css">

<body>
    
    <div id="wrap_bg">
        <!-- <img src="../images/card_news1/card_news1_bg.png" alt="card_news1_bg" class="bg"> -->
        <div class="wrap">
            <div class="text">
                <h1>CARD NEWS</h1>
                <h2>DESIGN CONCEPT</h2>
                <p>
 층간 소음에 관련된 주제를 건물들이 내는 소음과
<br>그걸 듣고 괴로워하는 보름달로 표현하였습니다. 주로
<br>밤에 문제가 일어나는 것을 고려하여 남색 계통의 배경
<br>으로 작업하였고 제목은 보름달과 동일한 노란색을
<br>입혔습니다. 제목은 존재감을 주기 위해 파셜산스,
<br>소제목과 내용은 구분을 위해 카페24 빛나는별,
<br>나눔스퀘어 네오를 사용하였습니다.
                </p>
                <h2>
                    COLOR PALETTE
                </h2>

                <div class="color_wrap">
                    <div class="color_box">
                        <div class="color color1"></div>
                        <p>#000B51</p>
                    </div>
                    <div class="color_box">
                        <div class="color color2"></div>
                        <p>#2D6592</p>
                    </div>
                    <div class="color_box">
                        <div class="color color3"></div>
                        <p>#0390F5</p>
                    </div>
                    <div class="color_box">
                        <div class="color color4"></div>
                        <p>#FBEA03</p>
                    </div>
                </div>

                <h2>FONT</h2>
                <div class="font">
                    <img src="../images/card_news2/cn2_font.png" alt="cn1_font">
                </div>


            </div>
            <div class="img">
                <img src="../images/card_news2/card_news2_1.png" alt="card_news1">
                <img src="../images/card_news2/card_news2_2.png" alt="card_news2">
                <img src="../images/card_news2/card_news2_3.png" alt="card_news3">
                <img src="../images/card_news2/card_news2_4.png" alt="card_news4">
            </div>

        </div>

        <div class="obj_1">
            <img src="../images/card_news2/obj_1.png" alt="obj_1">
        </div>
        <div class="obj_2">
            <img src="../images/card_news2/obj_2.png" alt="obj_2">
        </div>
        <div class="obj_3">
            <img src="../images/card_news2/obj_2.png" alt="obj_2">
        </div>



    </div>
