    <div id="wrap_bg">

            <div class="text">
                <h1>CARD NEWS</h1>
                <h2>DESIGN CONCEPT</h2>
                <p>
                    조깅을 하면서 쓰레기를 줍는다는 플로깅을 주제로
                    <br>자연 친화적인 녹색과 갈색을 사용하였으며, 주제를 계속 <br>강조할 수 있도록 캐릭터가 들고 있는 소품에 문구를 적어 <br>일러스트와 정보 전달을 자연스럽게
                    녹여내었습니다.
                    <br>폰트는 제목을 강조하는 파셜산스와 가독성이 좋은
                    <br>나눔스퀘어 네오를 사용하였습니다.
                </p>
                <h2>
                    COLOR PALETTE
                </h2>

                <div class="color_wrap">
                    <div class="color_box">
                        <div class="color color1"></div>
                        <p>#1db87c</p>
                    </div>
                    <div class="color_box">
                        <div class="color color2"></div>
                        <p>#90f5b6</p>
                    </div>
                    <div class="color_box">
                        <div class="color color3"></div>
                        <p>#f3b255</p>
                    </div>
                    <div class="color_box">
                        <div class="color color4"></div>
                        <p>#fff0df</p>
                    </div>
                    <div class="color_box">
